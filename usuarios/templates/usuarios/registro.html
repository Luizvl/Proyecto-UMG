{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de estudiante | PNGIB</title>

    <link rel="stylesheet" href="{% static 'usuarios/css/registro.css' %}">
</head>

<body>

<div class="contenedor">

    <h1>Registro de estudiante</h1>

    <p class="subtitulo">
        Plataforma Nacional para la Gestión Integral de Becas
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Crear cuenta
        </button>

    </form>

</div>

</body>
</html>
